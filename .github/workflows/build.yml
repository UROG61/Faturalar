name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'FATURA_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.altintas.faturasms'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.altintas.faturasms'
                  minSdk 26
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
                  versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'faturasms'
                      keyAlias 'faturasms'
                      keyPassword 'faturasms'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
