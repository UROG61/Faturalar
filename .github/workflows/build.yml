          package com.altintas.faturasms;

          import java.util.Locale;
          import java.util.regex.Pattern;

          /** Hangi SMS'in fatura/borç bildirimi olduğuna karar verir. Android'e bağımlı değil. */
          public final class BillFilter {
              private BillFilter() {}

              // Bilinen kurum gönderen adları (normalize edilmiş, küçük harf, Türkçe karaktersiz)
              private static final Pattern SENDER = Pattern.compile(
                      "(\\bck\\b|ckbogazici|bogazici|ckenerji|enerjisa|iski|igdas|aksa|gaz|elektrik|edas|bedas|ayedas|"
                      + "toroslar|baskent|aski|izsu|buski|meski|koski|asat|suski|\\bsu\\b)");

              // Fatura/borç içeriği
              private static final Pattern CONTENT = Pattern.compile(
                      "(fatura|son odeme|borcunuz|borc bilgi|odenmemis|abone|tesisat|sozlesme hesab|\\bkwh\\b|\\bm3\\b|tuketim)");

              // Tutar
              private static final Pattern AMOUNT = Pattern.compile("(\\d[\\d.,]*\\s*(tl|try)\\b|tutar)");

              // Asla iletilmeyecek özel mesajlar (doğrulama kodları vb.)
              private static final Pattern PRIVATE = Pattern.compile(
                      "(sifre|dogrulama|onay kodu|tek kullanimlik|\\botp\\b|parola|guvenlik kodu|giris kodu|kodunuz)");

              public static String norm(String s) {
                  if (s == null) return "";
                  StringBuilder b = new StringBuilder(s.length());
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      switch (c) {
                          case 'İ': case 'I': case 'ı': b.append('i'); break;
                          case 'Ş': case 'ş': b.append('s'); break;
                          case 'Ğ': case 'ğ': b.append('g'); break;
                          case 'Ü': case 'ü': b.append('u'); break;
                          case 'Ö': case 'ö': b.append('o'); break;
                          case 'Ç': case 'ç': b.append('c'); break;
                          case '³': b.append('3'); break;
                          case '̇': break; // birleşik nokta
                          default: b.append(Character.toLowerCase(c));
                      }
                  }
                  return b.toString().toLowerCase(Locale.ROOT);
              }

              public static boolean isBill(String from, String body) {
                  String f = norm(from), t = norm(body);
                  if (PRIVATE.matcher(t).find()) return false;
                  boolean content = CONTENT.matcher(t).find();
                  if (!content) return false;
                  boolean sender = SENDER.matcher(f).find() || SENDER.matcher(t).find();
                  boolean amount = AMOUNT.matcher(t).find();
                  return sender || (amount && t.contains("fatura"));
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/Forwarder.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.Telephony;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /** Fatura SMS'lerini Gmail'e iletir. Ağ işlemi yaptığı için ana iş parçacığında çağrılmamalı. */
          public final class Forwarder {
              private Forwarder() {}

              public static final String HOST = "smtp.gmail.com";
              public static final int PORT = 465;

              public static class Result {
                  public int found, sent, failed, skipped;
                  public String error;
              }

              /** Yeni gelen veya taranan SMS'leri işler; önce bekleyen kuyruğu da dener. */
              public static synchronized Result process(Context ctx, List<Sms> incoming) {
                  Store st = new Store(ctx);
                  Result r = new Result();
                  List<Sms> work = new ArrayList<>(st.queue());
                  for (Sms s : incoming) if (BillFilter.isBill(s.from, s.body)) work.add(s);
                  r.found = work.size();
                  if (work.isEmpty()) return r;
                  if (!st.configured()) {
                      st.setQueue(dedupe(work, st));
                      r.error = "Gmail adresi ve uygulama şifresi girilmemiş";
                      st.log("Bekletildi: " + work.size() + " SMS (ayar eksik)");
                      return r;
                  }
                  List<Sms> failed = new ArrayList<>();
                  for (Sms s : dedupe(work, st)) {
                      if (st.isSent(s.key())) { r.skipped++; continue; }
                      try {
                          Smtp.send(HOST, PORT, true, st.email(), st.pass(), st.email(), subject(s), body(s));
                          st.markSent(s.key());
                          r.sent++;
                          st.log("Gönderildi: " + s.from + " — " + shorten(s.body));
                      } catch (Smtp.SmtpException e) {
                          failed.add(s); r.failed++;
                          r.error = e.code == 535 || e.code == 534
                                  ? "Gmail şifreyi kabul etmedi. Normal şifre değil, 16 haneli uygulama şifresi gerekli."
                                  : "Gmail hatası (" + e.code + ")";
                          st.log("Hata: " + r.error);
                      } catch (Exception e) {
                          failed.add(s); r.failed++;
                          r.error = "İnternet yok veya Gmail'e ulaşılamadı";
                          st.log("Hata: " + r.error + " — sonra tekrar denenecek");
                      }
                  }
                  st.setQueue(failed);
                  return r;
              }

              private static List<Sms> dedupe(List<Sms> in, Store st) {
                  List<Sms> out = new ArrayList<>();
                  List<String> keys = new ArrayList<>();
                  for (Sms s : in) {
                      String k = s.key();
                      if (keys.contains(k) || st.isSent(k)) continue;
                      keys.add(k);
                      out.add(s);
                  }
                  return out;
              }

              /** Gelen kutusundaki son N günün SMS'leri. */
              public static List<Sms> readInbox(Context ctx, int days) {
                  List<Sms> out = new ArrayList<>();
                  long since = System.currentTimeMillis() - days * 86400000L;
                  ContentResolver cr = ctx.getContentResolver();
                  Uri uri = Telephony.Sms.Inbox.CONTENT_URI;
                  String[] proj = {Telephony.Sms.ADDRESS, Telephony.Sms.BODY, Telephony.Sms.DATE};
                  Cursor c = null;
                  try {
                      c = cr.query(uri, proj, Telephony.Sms.DATE + " > ?", new String[]{String.valueOf(since)}, Telephony.Sms.DATE + " ASC");
                      if (c != null) {
                          while (c.moveToNext()) out.add(new Sms(c.getString(0), c.getString(1), c.getLong(2)));
                      }
                  } finally {
                      if (c != null) c.close();
                  }
                  return out;
              }

              public static String subject(Sms s) {
                  return "Fatura SMS - " + s.from;
              }

              public static String body(Sms s) {
                  String d = new SimpleDateFormat("dd.MM.yyyy HH:mm", new Locale("tr")).format(new Date(s.date));
                  return "Bu mail telefondaki bir SMS'ten otomatik iletildi (Fatura SMS uygulaması).\n\n"
                          + "Gönderen: " + s.from + "\n"
                          + "SMS tarihi: " + d + "\n\n"
                          + s.body + "\n";
              }

              static String shorten(String s) {
                  s = s.replace('\n', ' ');
                  return s.length() > 70 ? s.substring(0, 70) + "…" : s;
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/MainActivity.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private Store store;
              private EditText email, pass;
              private TextView status, log;
              private Button scanBtn, testBtn;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  store = new Store(this);
                  setTitle("Fatura SMS");

                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  int p = dp(18);
                  root.setPadding(p, p, p, p);
                  sv.addView(root);

                  root.addView(text("Fatura SMS", 22, true));
                  root.addView(text("CK Boğaziçi, İSKİ, İGDAŞ gibi kurumlardan gelen fatura SMS'lerini Gmail'ine iletir. "
                          + "Fatura Takip uygulamasındaki \"Gmail'den yenile\" butonu da bunları otomatik okur. "
                          + "Doğrulama kodu, banka şifresi gibi mesajlar asla iletilmez.", 14, false));

                  root.addView(label("Gmail adresi"));
                  email = new EditText(this);
                  email.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS);
                  email.setText(store.email().isEmpty() ? "haciselim63@gmail.com" : store.email());
                  root.addView(email);

                  root.addView(label("Gmail uygulama şifresi (16 haneli)"));
                  pass = new EditText(this);
                  pass.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  pass.setHint(store.pass().isEmpty() ? "abcd efgh ijkl mnop" : "Kayıtlı (değiştirmek için yaz)");
                  root.addView(pass);
                  root.addView(text("Normal Gmail şifren değil. myaccount.google.com/apppasswords adresinden alınır.", 12, false));

                  testBtn = button("Kaydet ve test maili gönder");
                  testBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { saveAndTest(); } });
                  root.addView(testBtn);

                  scanBtn = button("Eski fatura SMS'lerini gönder (son 120 gün)");
                  scanBtn.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { scan(); } });
                  root.addView(scanBtn);

                  Button bat = button("Arka planda çalışmasına izin ver (pil)");
                  bat.setOnClickListener(new View.OnClickListener() { public void onClick(View v) { askBattery(); } });
                  root.addView(bat);

                  status = text("", 15, true);
                  status.setPadding(0, dp(14), 0, dp(6));
                  root.addView(status);

                  root.addView(label("Son işlemler"));
                  log = text("", 12, false);
                  log.setTypeface(Typeface.MONOSPACE);
                  root.addView(log);

                  setContentView(sv);
                  askSmsPermission();
                  refresh();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
                  // Bekleyen kuyruk varsa tekrar dene
                  if (store.configured() && !store.queue().isEmpty()) runForward(new ArrayList<Sms>(), "Bekleyen SMS'ler gönderiliyor…");
              }

              private void refresh() {
                  boolean perm = hasSms();
                  String s;
                  if (!perm) s = "⚠️ SMS izni verilmedi. Uygulama çalışamaz.";
                  else if (!store.configured()) s = "⚠️ Gmail uygulama şifresini gir ve test et.";
                  else s = "✅ Hazır. Yeni fatura SMS'leri otomatik iletilecek. Toplam iletilen: " + store.sentCount()
                          + (store.queue().isEmpty() ? "" : " · Bekleyen: " + store.queue().size());
                  status.setText(s);
                  log.setText(store.logText());
              }

              private void saveAndTest() {
                  String e = email.getText().toString().trim();
                  String pw = pass.getText().toString().replace(" ", "").trim();
                  if (e.isEmpty() || !e.contains("@")) { status.setText("Geçerli bir Gmail adresi yaz."); return; }
                  if (pw.isEmpty()) pw = store.pass();
                  if (pw.length() != 16) { status.setText("Uygulama şifresi 16 harf olmalı (boşluklar hariç)."); return; }
                  store.saveCreds(e, pw);
                  pass.setText("");
                  pass.setHint("Kayıtlı (değiştirmek için yaz)");
                  setBusy(true, "Test maili gönderiliyor…");
                  final String to = e, pwd = pw;
                  new Thread(new Runnable() {
                      public void run() {
                          String msg;
                          try {
                              Smtp.send(Forwarder.HOST, Forwarder.PORT, true, to, pwd, to, "Fatura SMS test",
                                      "Fatura SMS uygulaması Gmail'e bağlandı. Bu maili silebilirsin.");
                              store.log("Test maili gönderildi");
                              msg = "✅ Test maili gönderildi. Şimdi eski SMS'leri gönderebilirsin.";
                          } catch (Smtp.SmtpException ex) {
                              msg = (ex.code == 535 || ex.code == 534)
                                      ? "❌ Gmail şifreyi kabul etmedi. 16 haneli uygulama şifresini kontrol et (2 adımlı doğrulama açık olmalı)."
                                      : "❌ Gmail hatası: " + ex.code;
                              store.log(msg);
                          } catch (Exception ex) {
                              msg = "❌ Gmail'e ulaşılamadı. İnternet bağlantını kontrol et.";
                              store.log(msg);
                          }
                          final String m = msg;
                          runOnUiThread(new Runnable() { public void run() { setBusy(false, null); refresh(); status.setText(m); } });
                      }
                  }).start();
              }

              private void scan() {
                  if (!hasSms()) { askSmsPermission(); return; }
                  if (!store.configured()) { status.setText("Önce Gmail uygulama şifresini girip test et."); return; }
                  List<Sms> inbox;
                  try {
                      inbox = Forwarder.readInbox(this, 120);
                  } catch (Exception e) {
                      status.setText("SMS'ler okunamadı: " + e.getMessage());
                      return;
                  }
                  runForward(inbox, inbox.size() + " SMS tarandı, faturalar gönderiliyor…");
              }

              private void runForward(final List<Sms> list, String busyMsg) {
                  setBusy(true, busyMsg);
                  new Thread(new Runnable() {
                      public void run() {
                          final Forwarder.Result r = Forwarder.process(MainActivity.this, list);
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  setBusy(false, null);
                                  refresh();
                                  String m;
                                  if (r.found == 0) m = "Fatura SMS'i bulunamadı.";
                                  else m = r.sent + " fatura SMS'i gönderildi"
                                          + (r.skipped > 0 ? ", " + r.skipped + " zaten gönderilmişti" : "")
                                          + (r.failed > 0 ? ", " + r.failed + " gönderilemedi (" + r.error + ")" : "") + ".";
                                  status.setText(m);
                              }
                          });
                      }
                  }).start();
              }

              private void setBusy(boolean busy, String msg) {
                  scanBtn.setEnabled(!busy);
                  testBtn.setEnabled(!busy);
                  if (msg != null) status.setText(msg);
              }

              private boolean hasSms() {
                  return checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED
                          && checkSelfPermission(Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED;
              }

              private void askSmsPermission() {
                  if (!hasSms()) requestPermissions(new String[]{Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS}, 1);
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  refresh();
              }

              private void askBattery() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (Build.VERSION.SDK_INT >= 23 && pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      } else {
                          status.setText("✅ Pil kısıtlaması zaten kapalı.");
                      }
                  } catch (Exception e) {
                      startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  }
              }

              /* ---- küçük arayüz yardımcıları ---- */
              private int dp(int v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }

              private TextView text(String s, int sp, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, dp(4), 0, dp(4));
                  return t;
              }

              private TextView label(String s) {
                  TextView t = text(s, 13, true);
                  t.setTextColor(Color.GRAY);
                  t.setPadding(0, dp(14), 0, 0);
                  return t;
              }

              private Button button(String s) {
                  Button bt = new Button(this);
                  bt.setText(s);
                  bt.setAllCaps(false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.topMargin = dp(8);
                  bt.setLayoutParams(lp);
                  return bt;
              }
          }
          FATURA_EOF
          mkdir -p 'app/src/main/java/com/altintas/faturasms'
          cat > 'app/src/main/java/com/altintas/faturasms/Sms.java' <<'FATURA_EOF'
          package com.altintas.faturasms;

          /** Tek bir SMS. */
          public final class Sms {
              public final String from;
              public final String body;
              public final long date;

              public Sms(String from, String body, long date) {
                  this.from = from == null ? "" : from;
                  this.body = body == null ? "" : body;
                  this.date = date;
              }

              /** Aynı SMS'i iki kez göndermemek için anahtar. */
              public String key() { return from + "|" + (date / 60000L) + "|" + body.trim().hashCode(); }
          }
          FATURA_EOF
